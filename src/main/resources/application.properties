spring.application.name=acadezer
spring.profiles.default=local
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-unknown-properties=true
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.cors-origin=${CORS_ORIGIN:http://localhost:4200}
app.ai.api-key=${AI_API_KEY:${spring.ai.openai.api-key:}}
app.ai.model=${AI_MODEL:${spring.ai.openai.chat.options.model:openai/gpt-oss-20b}}
app.ai.url=${AI_URL:https://api.groq.com/openai/v1/chat/completions}
app.ai.timeout=${AI_TIMEOUT:20s}

# Load existing local secrets from disk; Maven excludes this file from the JAR.

#---
spring.config.activate.on-profile=local
spring.config.import=optional:file:./src/main/resources/application-local.properties
