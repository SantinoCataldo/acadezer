spring.application.name=acadezer
spring.profiles.default=local
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-unknown-properties=true
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors-origin=${CORS_ORIGIN:http://localhost:4200}
app.ai.api-key=${AI_API_KEY:${spring.ai.openai.api-key:}}
app.ai.model=${AI_MODEL:${spring.ai.openai.chat.options.model:openai/gpt-oss-20b}}
app.ai.url=${AI_URL:https://api.groq.com/openai/v1/chat/completions}
app.ai.timeout=${AI_TIMEOUT:20s}

# Only ClientIpResolver may interpret forwarding headers from explicitly trusted peers.
server.forward-headers-strategy=none
app.limits.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}
app.limits.max-keys=${RATE_LIMIT_MAX_KEYS:10000}
app.limits.login.account=${LOGIN_ACCOUNT_LIMIT:10}
app.limits.login.ip=${LOGIN_IP_LIMIT:100}
app.limits.login.window=${LOGIN_LIMIT_WINDOW:15m}
app.limits.register.account=${REGISTER_ACCOUNT_LIMIT:5}
app.limits.register.ip=${REGISTER_IP_LIMIT:30}
app.limits.register.window=${REGISTER_LIMIT_WINDOW:1h}
app.limits.ai.requests=${AI_USER_QUOTA:20}
app.limits.ai.window=${AI_QUOTA_WINDOW:1h}
app.limits.ai.max-concurrent=${AI_MAX_CONCURRENT:2}
app.limits.ai.max-concurrent-per-user=${AI_MAX_CONCURRENT_PER_USER:1}

# Load existing local secrets from disk; Maven excludes this file from the JAR.

#---
spring.config.activate.on-profile=local
spring.config.import=optional:file:./src/main/resources/application-local.properties
